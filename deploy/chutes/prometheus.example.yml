# Mount a key authorized for this private Chute as /run/secrets/chutes-api-key.
scrape_configs:
  - job_name: chutes-qwen3.8-27b
    scheme: https
    metrics_path: /metrics
    scrape_interval: 30s
    scrape_timeout: 15s
    follow_redirects: false
    authorization:
      type: Bearer
      credentials_file: /run/secrets/chutes-api-key
    static_configs:
      - targets: [kelsen-qwen-qwen3-8-27b-fp8.chutes.ai]
