# Explicit loopback-only listen. Under dstack host networking, binding
# 0.0.0.0 would publish the port through Phala's <app-id>-<port> gateway.
listen_addresses = '127.0.0.1'
port = 5432
max_connections = 100
shared_buffers = 128MB
dynamic_shared_memory_type = posix
log_timezone = 'UTC'
datestyle = 'iso, mdy'
timezone = 'UTC'
