pid /tmp/market-nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    upstream domain_observer { server unix:/run/domain-observer/probe.sock; }
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/market-client-body;
    proxy_temp_path /tmp/market-proxy;
    fastcgi_temp_path /tmp/market-fastcgi;
    uwsgi_temp_path /tmp/market-uwsgi;
    scgi_temp_path /tmp/market-scgi;
    # The old gateway-terminated endpoint exposes public bootstrap metadata only.
    server {
        listen 8080;
        location = /market-ca.pem { alias /tls-ca/ca.pem; default_type application/x-pem-file; }
        location = /healthz { proxy_pass http://127.0.0.1:3000/healthz; }
        location = / {
            default_type application/json;
            return 200 '{"service":"private-flex-inference-auctions","mode":"public-bootstrap-only","api_requires":"attested TLS passthrough","ca":"/market-ca.pem"}\n';
        }
        location / { return 426; }
    }
    server {
        listen 8443 ssl;
        # Reachable only on the private Compose network from in-CVM ingress.
        listen 8081;
        location = /domain-network.json {
            proxy_pass http://domain_observer;
            proxy_set_header Authorization $http_authorization;
            proxy_buffering off;
            add_header Cache-Control no-store always;
        }
        ssl_certificate /run/market-tls/leaf.pem;
        ssl_certificate_key /run/market-tls/leaf.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_tickets off;
        client_max_body_size 128k;
        location = /market-ca.pem { alias /tls-ca/ca.pem; default_type application/x-pem-file; }
        location = / {
            default_type application/json;
            return 200 '{"service":"private-flex-inference-auctions","mode":"live-provider","attestation":"/market/v1/aci/attestation","api":"/market/v1"}\n';
        }
        # The measured deployment declares its already pinned Docker image ID.
        # Only provenance metadata is added; quote, nonce and keyset are untouched.
        location = /market/v1/aci/attestation {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header Accept-Encoding "";
            proxy_buffering off;
            sub_filter_types application/json;
            sub_filter_once on;
            sub_filter '"tee_type":"tdx"' '"tee_type":"tdx","source_provenance":{"image_digest":"sha256:8ef09a1a577ca51e306f7819165c07a9d44a0334074c7ed0df07b692b81cff15","image_provenance":{"digest_kind":"docker-image-id","binary_sha256":"73742831654a037c48cc088483755d8f32f16c0a89300db6246b6eedd2d50107","build_input_manifest_sha256":"9c1d7a8d323c31b2c89fd8ac6ae1c6e9125bb99d0df613be31f44fa2c5ee7490"}}';
        }
        location = /market/v1/provider-evidence/ {
            alias /data/chutes-run/provider-evidence/;
            autoindex on;
            autoindex_format json;
        }
        location / {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 300s;
        }
    }
}
