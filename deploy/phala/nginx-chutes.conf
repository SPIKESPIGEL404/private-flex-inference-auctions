pid /tmp/market-nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/market-client-body;
    proxy_temp_path /tmp/market-proxy;
    fastcgi_temp_path /tmp/market-fastcgi;
    uwsgi_temp_path /tmp/market-uwsgi;
    scgi_temp_path /tmp/market-scgi;
    # The old gateway-terminated endpoint exposes public bootstrap metadata only.
    server {
        listen 8080;
        location = /market-ca.pem { alias /tls-ca/ca.pem; default_type application/x-pem-file; }
        location = /healthz { proxy_pass http://127.0.0.1:3000/healthz; }
        location = / {
            default_type application/json;
            return 200 '{"service":"private-flex-inference-auctions","mode":"public-bootstrap-only","api_requires":"attested TLS passthrough","ca":"/market-ca.pem"}\n';
        }
        location / { return 426; }
    }
    server {
        listen 8443 ssl;
        ssl_certificate /run/market-tls/leaf.pem;
        ssl_certificate_key /run/market-tls/leaf.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_tickets off;
        client_max_body_size 128k;
        location = /market-ca.pem { alias /tls-ca/ca.pem; default_type application/x-pem-file; }
        location = / {
            default_type application/json;
            return 200 '{"service":"private-flex-inference-auctions","mode":"live-provider","attestation":"/market/v1/aci/attestation","api":"/market/v1"}\n';
        }
        location = /market-catalog.json {
            alias /data/chutes-run/state/catalog.json;
            default_type application/json;
        }
        location = /market/v1/provider-evidence/ {
            alias /data/chutes-run/provider-evidence/;
            autoindex on;
            autoindex_format json;
        }
        location / {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 300s;
        }
    }
}
