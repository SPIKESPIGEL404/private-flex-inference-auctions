global:
  scrape_interval: 5s
  scrape_timeout: 4s
scrape_configs:
  - job_name: chutes-qwen3.8-27b
    scheme: https
    metrics_path: /metrics
    follow_redirects: false
    honor_timestamps: false
    body_size_limit: 4MB
    sample_limit: 5000
    authorization:
      type: Bearer
      credentials_file: /run/secrets/chutes-api-key
    static_configs:
      - targets: [kelsen-qwen-qwen3-8-27b-fp8.chutes.ai]
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'process_start_time_seconds|vllm:.*'
        action: keep
