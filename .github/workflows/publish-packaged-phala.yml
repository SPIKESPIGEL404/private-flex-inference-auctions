name: Publish packaged Phala images
on:
  workflow_dispatch:
    inputs:
      component:
        type: choice
        options: [packaged-current, mainnet-artifact]
        default: packaged-current
      artifactRelease:
        description: Reviewed mainnet-auction-SOURCE release tag (Mainnet mode only)
        type: string
        required: false
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Authenticate container publishing
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Verify published bases, build, check, and publish
        if: inputs.component != 'mainnet-artifact'
        run: python3 scripts/publish-packaged-phala.py
      - name: Verify offline Mainnet bootstrap and publish the current-source image
        if: inputs.component == 'mainnet-artifact'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAINNET_ARTIFACT_RELEASE: ${{ inputs.artifactRelease }}
        run: python3 scripts/publish-mainnet-auction.py
      - uses: actions/upload-artifact@v4
        with:
          name: phala-published-images
          path: published-images.json
          if-no-files-found: error
