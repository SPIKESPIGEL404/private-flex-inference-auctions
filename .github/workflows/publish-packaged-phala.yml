name: Publish packaged Phala images
on:
  workflow_dispatch:
    inputs:
      workspace_only:
        description: Update only the controlled workspace using the pinned deployed base
        type: boolean
        default: false
      workspace_base:
        description: Immutable current workspace image (required for workspace-only)
        type: string
        default: ''
      workspace_native_release:
        description: Source-matched controlled-supply native artifact release
        type: string
        default: ''
      workspace_native_sha256:
        description: SHA256 of the reviewed Linux native artifact
        type: string
        default: ''
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate container publishing
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Verify published bases, build, check, and publish
        if: ${{ !inputs.workspace_only }}
        run: python3 scripts/publish-packaged-phala.py
      - name: Build and publish workspace update
        if: ${{ inputs.workspace_only }}
        env:
          WORKSPACE_BASE: ${{ inputs.workspace_base }}
          WORKSPACE_NATIVE_RELEASE: ${{ inputs.workspace_native_release }}
          WORKSPACE_NATIVE_SHA256: ${{ inputs.workspace_native_sha256 }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/publish-playground-workspace.py
      - uses: actions/upload-artifact@v4
        with:
          name: phala-published-images
          path: published-images.json
          if-no-files-found: error
