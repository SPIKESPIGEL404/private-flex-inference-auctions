[package]
name = "flex-scheduler"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Durable external prefill gating scheduler core"

[dependencies]
ed25519-dalek = "=2.2.0"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
thiserror = "=2.0.21"
reqwest = { version = "=0.12.28", default-features = false, features = ["json"] }
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }

[dev-dependencies]
tempfile = "=3.27.0"

[[example]]
name = "phase1_fixture"
path = "examples/phase1_fixture.rs"
